name: Build plugin
on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # native-platform lib triggers a JDK 25 native-access warning in the
      # Gradle launcher JVM (GRADLE_OPTS targets it; org.gradle.jvmargs only
      # reaches the daemon).
      GRADLE_OPTS: "--enable-native-access=ALL-UNNAMED"
    permissions:
      contents: write   # allow the release step to create GitHub Releases on tags
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev
      - name: Cache Gradle (incl. downloaded Rider SDK)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Cache NuGet (ReSharper/Rider .NET SDK packages)
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: ./gradlew --no-daemon --console=plain :protocol:rdgen
      - run: ./gradlew --no-daemon --console=plain buildPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/distributions/**
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Update updatePlugins.xml on main (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP=$(basename build/distributions/*.zip)
          SINCE=$(grep -oP 'pluginSinceBuild\s*=\s*\K\S+' gradle.properties)
          UNTIL=$(grep -oP 'pluginUntilBuild\s*=\s*\K\S+' gradle.properties)
          git fetch --tags origin
          # Only the newest tag may move the repository (CI is sometimes re-run on old tags).
          [ "$(git tag -l 'v*' --sort=-v:refname | head -1)" = "$GITHUB_REF_NAME" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cat > updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Custom plugin repository (JetBrains "Manage Plugin Repositories" format).
               Add https://raw.githubusercontent.com/gaetan-deturche/rider-mcp-plugin/main/updatePlugins.xml
               in Settings | Plugins | gear | Manage Plugin Repositories to receive updates.
               Regenerated by ci.yml on every v* tag. -->
          <plugins>
            <plugin id="dev.ridermcp"
                    url="https://github.com/gaetan-deturche/rider-mcp-plugin/releases/download/${GITHUB_REF_NAME}/${ZIP}"
                    version="${VERSION}">
              <idea-version since-build="${SINCE}" until-build="${UNTIL}"/>
            </plugin>
          </plugins>
          EOF
          sed -i 's/^          //' updatePlugins.xml
          git add updatePlugins.xml
          if ! git diff --cached --quiet; then
            git commit -m "Point updatePlugins.xml at ${GITHUB_REF_NAME}"
            git push origin main
          fi
